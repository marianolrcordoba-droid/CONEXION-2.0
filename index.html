<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6070"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>CONEXIÓN 2.0</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef5f7;color:#12303a}.app{min-height:100vh;display:flex}.side{width:250px;background:#083d4b;color:white;padding:20px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;font-weight:800;margin-bottom:4px}.tag{font-size:12px;opacity:.8;margin-bottom:20px}.nav button{width:100%;text-align:left;background:transparent;border:0;color:#d9f4f7;padding:10px;border-radius:10px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#0d7181}.main{flex:1;padding:24px;max-width:1300px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.pill{background:white;padding:9px 13px;border-radius:20px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:white;border:1px solid #d6e4e7;border-radius:18px;padding:18px;box-shadow:0 5px 18px #0000000b}.tile{cursor:pointer;min-height:125px}.icon{font-size:34px}.card h3{margin:8px 0 6px}.muted{color:#61777d}.btn{border:0;border-radius:12px;padding:11px 14px;background:#0b6676;color:white;cursor:pointer;font-weight:700}.btn.alt{background:#dceef1;color:#084553}.btn.danger{background:#bd2735}.actions{display:flex;gap:8px;flex-wrap:wrap}.keypad{display:grid;grid-template-columns:repeat(3,80px);gap:10px;justify-content:center}.keypad button{height:55px;font-size:20px;border:0;border-radius:12px;background:#e7f2f4}.number{font-size:28px;text-align:center;min-height:45px;margin:10px}.preview{max-width:240px;max-height:240px;border-radius:14px;display:none}.notice{padding:14px;border-radius:12px;background:#fff7df;margin:12px 0}.ok{background:#e3f7ed}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal>div{background:white;border-radius:20px;padding:24px;max-width:520px;width:100%}.watch{width:210px;margin:10px auto;padding:22px 16px;border-radius:42px;background:#111;color:white;text-align:center;box-shadow:0 10px 30px #0003}.watchface{background:#13242a;border-radius:28px;padding:20px}.watch button{width:100%;margin:6px 0;border:0;border-radius:14px;padding:10px;background:#0d7181;color:white}.bottom{display:none}
@media(max-width:800px){.side{display:none}.main{padding:15px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#083d4b;padding:8px;gap:6px}.bottom button{flex:1;border:0;background:#0d7181;color:white;border-radius:10px;padding:9px}.main{padding-bottom:75px}}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccdfe3;border-radius:10px;margin:6px 0 12px;font:inherit}
</style></head><body><div class="app"><aside class="side"><div class="brand">CONEXIÓN 2.0</div><div class="tag">Una nueva forma de estar cerca.</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Inicio</h1><div class="muted">Córdoba · <span id="clock"></span></div></div><span class="pill">DEMO</span></div><section id="view"></section></main></div><div class="bottom"><button onclick="home()">Inicio</button><button onclick="allApps()">Apps</button><button onclick="quick()">🆘 Aviso</button></div><div class="modal" id="modal"><div><div id="modalText"></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="closeModal()">Cerrar</button></div></div></div><script>
const apps=[['call','📞','Llamada normal'],['emergency','🚨','Emergencias'],['gender','🟣','Violencia de género'],['lgtbi','🏳️‍🌈','LGTBI+'],['cyber','🎓','Ciberacoso y acoso escolar'],['elder','👴','Personas mayores y vulnerables'],['safe','💬','Comunicación segura'],['lostphone','📱','Teléfono perdido o robado'],['pets','🐾','Mascotas perdidas'],['info','📍','Información y orientación'],['settings','⚙️','Configuración / Accesibilidad / Idiomas'],['watch','⌚','Conexión remota (Smartwatch)']];
const nav=document.getElementById('nav'); apps.forEach(a=>{let b=document.createElement('button');b.id='n-'+a[0];b.textContent=a[1]+'  '+a[2];b.onclick=()=>show(a[0]);nav.appendChild(b)});function clock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}setInterval(clock,1000);clock();
function setActive(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let x=document.getElementById('n-'+id);if(x)x.classList.add('active')}
function home(){document.getElementById('title').textContent='CONEXIÓN 2.0';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('view').innerHTML='<div class="card"><h2>Una nueva forma de estar cerca.</h2><p class="muted">Demo interactiva de la red de comunicación y apoyo ciudadano.</p><div class="grid" id="homegrid"></div></div>';let g=document.getElementById('homegrid');apps.forEach(a=>g.innerHTML+=`<div class="card tile" onclick="show('${a[0]}')"><div class="icon">${a[1]}</div><h3>${a[2]}</h3><div class="muted">Abrir servicio</div></div>`)}
function allApps(){home()}
function show(id){setActive(id);let a=apps.find(x=>x[0]==id);document.getElementById('title').textContent=a[2];let v=document.getElementById('view');if(id==='call')return call(v);if(id==='pets')return pets(v);if(id==='emergency')return emergency(v);if(id==='watch')return watch(v);let data={gender:['Protección y orientación','Pedir ayuda, orientación y recursos especializados.'],lgtbi:['Espacio seguro','Habla con una persona o servicio de apoyo de forma confidencial.'],cyber:['Ciberacoso y acoso escolar','Pedir ayuda sin tener que explicar la situación delante de otras personas.'],elder:['Personas mayores y vulnerables','“No sé dónde estoy”, solicitar ayuda, compartir ubicación o contactar con familia.'],safe:['Comunicación segura','Llamadas privadas, mensajes seguros, profesionales y solicitud de ayuda.'],lostphone:['Teléfono perdido o robado','Orientación para proteger cuentas, pagos, identidad y contactar con servicios.'],info:['Información y orientación','Centros sanitarios, farmacias, policía, servicios sociales, transporte y rutas.'],settings:['Configuración','Accesibilidad, tamaño de texto, contraste, voz, idioma y privacidad.']}[id];v.innerHTML=`<div class="card"><h2>${data[0]}</h2><p>${data[1]}</p><div class="notice">Esta versión es una demostración. Las conexiones reales con servicios externos requerirían acuerdos, protocolos y desarrollo específico.</div><div class="actions"><button class="btn" onclick="demo('${data[0]}')">Iniciar demostración</button><button class="btn alt" onclick="quick()">🆘 Aviso rápido</button></div></div>`}
function demo(t){openModal('<h2>'+t+'</h2><p>Solicitud registrada en el entorno de demostración de CONEXIÓN 2.0.</p><p><b>Estado:</b> simulación activa.</p>')}
function call(v){v.innerHTML='<div class="card"><h2>Llamada normal</h2><div class="number" id="num"></div><div class="keypad">'+[1,2,3,4,5,6,7,8,9,'*',0,'#'].map(x=>`<button onclick="dial('${x}')">${x}</button>`).join('')+'</div><div class="actions" style="justify-content:center;margin-top:14px"><button class="btn" onclick="startCall()">📞 Llamar</button><button class="btn alt" onclick="clr()">Borrar</button></div><p class="muted">Demo: no realiza llamadas reales desde esta página.</p></div>'}
function dial(x){document.getElementById('num').textContent+=(x)}function clr(){document.getElementById('num').textContent=''}function startCall(){let n=document.getElementById('num').textContent||'sin número';openModal('<h2>📞 Llamada en demostración</h2><p>Conectando con <b>'+n+'</b>...</p><p>En una versión real, el punto utilizaría su sistema de comunicaciones autorizado.</p>')}
function pets(v){v.innerHTML='<div class="grid"><div class="card"><h2>🐾 He perdido mi mascota</h2><input id="petname" placeholder="Nombre de la mascota"><input id="petphone" placeholder="Teléfono de contacto" inputmode="tel"><textarea id="petdesc" placeholder="Descripción, zona, características..."></textarea><input id="petimg" type="file" accept="image/*" capture="environment" onchange="petPreview(event)"><img id="preview" class="preview"><div class="actions"><button class="btn" onclick="savePet()">Guardar aviso</button><button class="btn alt" onclick="clearPet()">Borrar</button></div></div><div class="card"><h2>🔎 He encontrado una mascota</h2><p>Fotografía el animal y la demo simulará una búsqueda de coincidencias.</p><input id="foundimg" type="file" accept="image/*" capture="environment"><button class="btn" onclick="matchPet()">Buscar coincidencias</button><div id="match"></div></div></div>'}
function petPreview(e){let f=e.target.files[0],p=document.getElementById('preview');if(f){p.src=URL.createObjectURL(f);p.style.display='block'}}function savePet(){let d={name:petname.value,phone:petphone.value,desc:petdesc.value,date:new Date().toISOString()};localStorage.setItem('conexion20_pet',JSON.stringify(d));openModal('<h2>🐾 Aviso guardado</h2><p>El aviso se ha guardado localmente para la demostración.</p>')}function clearPet(){localStorage.removeItem('conexion20_pet');petname.value=petphone.value=petdesc.value='';document.getElementById('preview').style.display='none'}function matchPet(){document.getElementById('match').innerHTML='<div class="notice ok"><b>Posible coincidencia encontrada.</b><br>Demo: “Luna”, zona Córdoba. Contacto disponible en el aviso simulado.</div>'}
function emergency(v){v.innerHTML='<div class="grid">'+[['🚨','Emergencia inmediata'],['👮','Policía'],['🚑','Emergencias sanitarias'],['🔥','Incendio'],['⚠️','Estoy en peligro'],['📍','Enviar ubicación']].map(x=>`<div class="card tile"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><button class="btn" onclick="emergencyAction('${x[1]}')">Activar demo</button></div>`).join('')+'</div>'}function emergencyAction(t){if(t==='Enviar ubicación'&&navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>openModal('<h2>📍 Ubicación obtenida</h2><p>Latitud: '+p.coords.latitude.toFixed(5)+'<br>Longitud: '+p.coords.longitude.toFixed(5)+'</p>'),()=>openModal('<h2>📍 Ubicación</h2><p>No se concedió permiso de ubicación.</p>'))}else openModal('<h2>'+t+'</h2><p>Aviso de emergencia simulado. En una versión real se aplicaría el protocolo correspondiente.</p>')}
function watch(v){v.innerHTML='<div class="grid"><div class="card"><h2>⌚ Conexión remota</h2><p>Demostración del concepto para tu Redmi Watch 4.</p><div class="watch"><div class="watchface"><div style="font-size:26px">CONEXIÓN 2.0</div><div style="font-size:12px;margin:8px">DISPOSITIVO</div><button onclick="watchAlert()">🆘 Aviso rápido</button><button onclick="watchLocation()">📍 Mi ubicación</button><button onclick="watchCall()">📞 Contactar</button></div></div><div class="notice">Esta interfaz simula el reloj. La conexión real con el Redmi Watch 4 depende de las APIs y capacidades que Xiaomi exponga para ese modelo.</div></div><div class="card"><h2>Estado</h2><p id="watchstatus">⌚ Modo demostración activo.</p><button class="btn" onclick="openModal('<h2>⌚ Comprobación</h2><p>El móvil está preparado para incorporar una integración real cuando exista una vía compatible con el reloj.</p>')">Comprobar conexión</button></div></div>'}function watchAlert(){openModal('<h2>🆘 Aviso desde la muñeca</h2><p>Demostración: se enviaría una alerta y la ubicación al servicio CONEXIÓN 2.0.</p>')}function watchLocation(){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>openModal('<h2>📍 Ubicación del reloj</h2><p>Demo usando la ubicación disponible en el dispositivo móvil.</p>'),()=>openModal('<h2>📍 Ubicación</h2><p>Permiso no concedido.</p>'));else openModal('<h2>📍 Ubicación</h2><p>No disponible en este navegador.</p>')}function watchCall(){openModal('<h2>📞 Contactar</h2><p>Demo: el reloj solicitaría al móvil iniciar la comunicación.</p>')}
function quick(){openModal('<h2>🆘 Aviso rápido</h2><p>Demo: se prepararía una alerta con ubicación y datos mínimos necesarios.</p>')}function openModal(x){modal.style.display='flex';modalText.innerHTML=x}function closeModal(){modal.style.display='none'}home();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script></body></html>
